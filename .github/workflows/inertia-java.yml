name: Inertia Java verification

on:
  push:
    paths: ['inertia-java/**', '!inertia-java/docs/**', '.github/workflows/inertia-java.yml']
  pull_request:
    paths: ['inertia-java/**', '!inertia-java/docs/**', '.github/workflows/inertia-java.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inertia-java-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      INERTIA_BROWSER_CHANNEL: chromium
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: inertia-java/**/pom.xml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: inertia-java/examples/spring-react/frontend/package-lock.json
      - name: Install locked browser tooling and Chromium
        working-directory: inertia-java/examples/spring-react/frontend
        run: |
          npm ci
          npx --no-install playwright install --with-deps --no-shell chromium
      - name: Verify documentation publication boundary
        run: node --test inertia-java/deploy/documentation.test.mjs
      - name: Verify Java, frontend and owned browser scenarios
        env:
          INERTIA_VERIFY_OUTPUT: ${{ runner.temp }}/inertia-java-verification
        run: node inertia-java/scripts/verify.mjs
      - name: Verify external Maven consumption and API guide examples
        env:
          INERTIA_CONSUMER_OUTPUT: ${{ runner.temp }}/inertia-java-consumer
        run: INERTIA_CONSUMER_DEPENDENCY_CACHE="$HOME/.m2/repository" python3 inertia-java/scripts/verify-maven-consumer.py
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: inertia-java-verification-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/inertia-java-verification
            ${{ runner.temp }}/inertia-java-consumer/summary.json
            ${{ runner.temp }}/inertia-java-consumer/*.log
            ${{ runner.temp }}/inertia-java-consumer/consumer/pom.xml
            ${{ runner.temp }}/inertia-java-consumer/consumer/src
            inertia-java/**/target/surefire-reports
