name: Publish Inertia Java documentation

# Maintainer-initiated publication after Pages is configured for GitHub Actions.
# PR verification uses the separate read-only documentation workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inertia-java-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'royalwang/inertia-java' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      INERTIA_DOCS_BASE: /inertia-java/
      INERTIA_BROWSER_CHANNEL: chromium
      INERTIA_DOCS_OUTPUT: ${{ runner.temp }}/inertia-docs-pages
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: inertia-java/**/pom.xml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: inertia-java/docs/package-lock.json
      - name: Build matching Javadoc classifiers
        working-directory: inertia-java
        run: ./mvnw --batch-mode -DskipTests package
      - name: Build and verify site
        working-directory: inertia-java/docs
        run: |
          npm ci
          npx --no-install playwright install --with-deps --no-shell chromium
          npm run docs:check
          npm run docs:dependencies -- "$INERTIA_DOCS_OUTPUT/dependencies"
          npm run docs:build
          npm run docs:smoke
      - name: Preserve registered immutable release snapshots
        working-directory: inertia-java/docs
        run: |
          npm run docs:assemble-versions
          npm run docs:smoke-versions
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: inertia-java/docs/.vitepress/dist
      - name: Retain publication evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: inertia-java-pages-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          path: |
            ${{ runner.temp }}/inertia-docs-pages/*/summary.json
            ${{ runner.temp }}/inertia-docs-pages/*/*.log
            ${{ runner.temp }}/inertia-docs-pages/*/*.png
            ${{ runner.temp }}/inertia-docs-pages/dependencies/**

  deploy:
    needs: build
    if: github.repository == 'royalwang/inertia-java' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
