name: Inertia Java documentation

on:
  push:
    paths:
      - 'inertia-java/docs/**'
      - 'inertia-java/**/src/main/java/**'
      - 'inertia-java/**/src/main/javadoc/**'
      - 'inertia-java/**/pom.xml'
      - 'inertia-java/pom.xml'
      - 'inertia-java/README.md'
      - 'inertia-java/CONTRIBUTING.md'
      - 'inertia-java/SECURITY.md'
      - 'inertia-java/deploy/documentation*'
      - 'inertia-java/scripts/dependency-inventory.py'
      - 'docs/inertia-java/open-source-docs-catalog.json'
      - 'docs/inertia-java/readme-topic-migration.json'
      - 'docs/inertia-java/verification/readme-before-topic-migration.txt'
      - '.github/workflows/inertia-java-docs*.yml'
  pull_request:
    paths:
      - 'inertia-java/docs/**'
      - 'inertia-java/**/src/main/java/**'
      - 'inertia-java/**/src/main/javadoc/**'
      - 'inertia-java/**/pom.xml'
      - 'inertia-java/pom.xml'
      - 'inertia-java/README.md'
      - 'inertia-java/CONTRIBUTING.md'
      - 'inertia-java/SECURITY.md'
      - 'inertia-java/deploy/documentation*'
      - 'inertia-java/scripts/dependency-inventory.py'
      - 'docs/inertia-java/open-source-docs-catalog.json'
      - 'docs/inertia-java/readme-topic-migration.json'
      - 'docs/inertia-java/verification/readme-before-topic-migration.txt'
      - '.github/workflows/inertia-java-docs*.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inertia-java-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      examples: ${{ steps.scope.outputs.examples }}
    env:
      INERTIA_DOCS_BASE_COMMIT: ${{ github.event.pull_request.base.sha || github.event.before }}
      INERTIA_BROWSER_CHANNEL: chromium
    steps:
      - name: Set runner evidence directories
        run: |
          printf '%s\n' "INERTIA_DOCS_OUTPUT=$RUNNER_TEMP/inertia-docs" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Validate documentation workflow expressions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck= -pyflakes= .github/workflows/inertia-java-docs.yml .github/workflows/inertia-java-docs-deploy.yml .github/workflows/inertia-java-docs-links.yml .github/workflows/inertia-java-docs-snapshot.yml
      - name: Select executable-example checks
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import os, subprocess
          base = os.environ['BASE_SHA']
          head = os.environ['HEAD_SHA']
          if os.environ['EVENT_NAME'] == 'workflow_dispatch' or not base or set(base) == {'0'}:
              required = True
          else:
              paths = subprocess.check_output(['git', 'diff', '--name-only', base, head], text=True).splitlines()
              required = any(p.startswith('inertia-java/docs/examples/') or p.startswith('inertia-java/docs/scripts/') or p in ('inertia-java/docs/api-guide.md', '.github/workflows/inertia-java-docs.yml') for p in paths)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('examples=' + str(required).lower() + '\n')
          PY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: inertia-java/docs/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: inertia-java/**/pom.xml
      - name: Build actual API classifiers
        working-directory: inertia-java
        run: ./mvnw --batch-mode -DskipTests package
      - name: Install documentation tools and browser
        working-directory: inertia-java/docs
        run: |
          npm ci
          npx --no-install playwright install --with-deps --no-shell chromium
      - name: Verify publication selection
        run: node --test inertia-java/deploy/documentation.test.mjs
      - name: Check and build documentation
        working-directory: inertia-java/docs
        run: |
          npm run docs:check
          npm run docs:dependencies -- "$INERTIA_DOCS_OUTPUT/dependencies"
          npm run docs:build
          npm run docs:smoke
      - name: Retain offline site and browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: inertia-java-docs-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          path: |
            inertia-java/docs/.vitepress/dist
            ${{ runner.temp }}/inertia-docs/*/summary.json
            ${{ runner.temp }}/inertia-docs/*/*.log
            ${{ runner.temp }}/inertia-docs/*/*.png
            ${{ runner.temp }}/inertia-docs/dependencies/**

  examples:
    needs: site
    if: needs.site.outputs.examples == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      INERTIA_BROWSER_CHANNEL: chromium
    steps:
      - name: Set runner evidence directories
        run: |
          printf '%s\n' "INERTIA_DOCS_OUTPUT=$RUNNER_TEMP/inertia-docs-examples" >> "$GITHUB_ENV"
          printf '%s\n' "INERTIA_CONSUMER_OUTPUT=$RUNNER_TEMP/inertia-docs-consumer" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: inertia-java/**/pom.xml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: |
            inertia-java/docs/package-lock.json
            inertia-java/examples/spring-react/frontend/package-lock.json
      - name: Build local library artifacts
        working-directory: inertia-java
        run: ./mvnw install
      - name: Build application frontend for distribution checks
        working-directory: inertia-java/examples/spring-react/frontend
        run: |
          npm ci
          npm run typecheck
          npm run build
      - name: Install documentation acceptance tools
        working-directory: inertia-java/docs
        run: |
          npm ci
          npx --no-install playwright install --with-deps --no-shell chromium
      - name: Verify canonical API examples and external browser application
        working-directory: inertia-java/docs
        run: |
          INERTIA_CONSUMER_DEPENDENCY_CACHE="$HOME/.m2/repository" npm run docs:examples
          npm run docs:quick-start
      - name: Retain example evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: inertia-java-docs-examples-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          path: |
            ${{ runner.temp }}/inertia-docs-examples/*/summary.json
            ${{ runner.temp }}/inertia-docs-examples/*/*.log
            ${{ runner.temp }}/inertia-docs-examples/*/*.png
            ${{ runner.temp }}/inertia-docs-examples/*/application/pom.xml
            ${{ runner.temp }}/inertia-docs-examples/*/application/src
            ${{ runner.temp }}/inertia-docs-consumer/summary.json
            ${{ runner.temp }}/inertia-docs-consumer/*.log
